name: Build and Release APK

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      # 3. Check Flutter installation
      - name: Flutter doctor
        run: flutter doctor -v

      # 4. Install dependencies
      - name: Get dependencies
        run: flutter pub get

      # 5. Quality gate: fail the release on analysis *errors* only.
      #    The codebase carries a documented warning/info baseline (AGENTS.md),
      #    so warnings/infos are reported but don't block a release.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # 6. Run the full test suite for visibility. The suite has a documented
      #    set of known baseline failures (AGENTS.md), so this step reports
      #    results without blocking — flip `continue-on-error` to false once
      #    the baseline is green.
      - name: Run tests
        run: flutter test
        continue-on-error: true

      # 7. Build release APK
      - name: Build APK
        run: flutter build apk --release

      # 8. Create GitHub Release and upload APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          make_latest: true
